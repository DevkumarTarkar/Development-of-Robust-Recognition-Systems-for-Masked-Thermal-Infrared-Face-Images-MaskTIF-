name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Core Imports
        run: |
          python -c "import flask, torch, torchvision; print('Imports OK')"

      - name: Create Dummy Model
        run: |
          mkdir -p models
          python -c "
          import torch
          from torchvision import models
          m=models.resnet50(weights=None)
          m.fc=torch.nn.Linear(m.fc.in_features,8)
          torch.save(m.state_dict(),'models/masktif_model.pth')
          print('Dummy model ready')
          "

      - name: Test Backend Health
        working-directory: backend
        run: |
          python -c "
          import sys
          sys.path.insert(0,'..')
          from app import app
          with app.test_client() as c:
              r=c.get('/health')
              assert r.status_code==200
          print('Health route OK')
          "

      - name: Verify Frontend Files
        run: |
          test -f frontend/index.html
          test -f frontend/register.html
          test -f frontend/dashboard.html
          test -f frontend/css/style.css
          test -f frontend/js/auth.js
          test -f frontend/js/predict.js

      - name: Serve Frontend
        run: |
          cd frontend
          python -m http.server 8000 &
          sleep 3
          curl -I http://127.0.0.1:8000/index.html
          curl -I http://127.0.0.1:8000/register.html
          curl -I http://127.0.0.1:8000/dashboard.html
          echo "Frontend OK"