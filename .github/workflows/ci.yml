name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Core Imports
        run: |
          python -c "import flask, numpy, onnxruntime; print('Imports OK')"

      # 🔥 Torch removed (not needed now)

      - name: Ensure Model Files Exist
        run: |
          test -f models/masktif_model.onnx
          test -f models/masktif_model.onnx.data
          echo "ONNX model files found"

      - name: Test Backend Health
        working-directory: backend
        run: |
          python -c "
          import sys
          sys.path.insert(0,'..')
          from app import app
          with app.test_client() as c:
              r=c.get('/health')
              assert r.status_code==200
          print('Health route OK')
          "

      - name: Run backend tests (pytest)
        working-directory: backend
        run: |
          pytest -q

      - name: Verify Frontend Files
        run: |
          test -f frontend/index.html
          test -f frontend/register.html
          test -f frontend/dashboard.html
          test -f frontend/css/style.css
          test -f frontend/js/auth.js
          test -f frontend/js/predict.js
          echo "Frontend files OK"

      - name: Serve Frontend
        run: |
          cd frontend
          python -m http.server 8000 &
          sleep 3
          curl -I http://127.0.0.1:8000/index.html
          curl -I http://127.0.0.1:8000/register.html
          curl -I http://127.0.0.1:8000/dashboard.html
          echo "Frontend OK"